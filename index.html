<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="לוח חשבון אתר">
<meta name="theme-color" content="#0F2138">
<title>לוח חשבון אתר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&family=Assistant:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2138;
    --navy-deep:#0A1728;
    --line:#2E5090;
    --concrete:#C9C4B8;
    --concrete-dark:#98917F;
    --chalk:#F1EFE6;
    --orange:#FF7A29;
    --orange-deep:#D9601A;
    --red:#E1524B;
    --green:#4CAF7D;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Assistant', sans-serif;
    background:
      linear-gradient(var(--navy), var(--navy)),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(46,80,144,0.35) 39px, rgba(46,80,144,0.35) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(46,80,144,0.35) 39px, rgba(46,80,144,0.35) 40px);
    background-color:var(--navy);
    color:var(--chalk);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
  }
  #app{width:100%; max-width:480px; display:flex; flex-direction:column; gap:10px;}
  .eyebrow{
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--orange);
    text-align:center;
  }
  h1.title{
    font-family:'Heebo', sans-serif;
    font-weight:900;
    font-size:24px;
    text-align:center;
    letter-spacing:-0.5px;
    line-height:1.15;
  }
  p.subtitle{
    text-align:center;
    color:var(--concrete);
    font-size:14px;
    line-height:1.45;
  }
  .card{
    background:var(--chalk);
    color:var(--navy-deep);
    border-radius:var(--radius);
    padding:14px 18px;
    position:relative;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .mode-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    width:100%;
    background:var(--chalk);
    color:var(--navy-deep);
    border:none;
    border-radius:var(--radius);
    padding:18px 20px;
    cursor:pointer;
    text-align:right;
    font-family:'Assistant', sans-serif;
    box-shadow:0 8px 18px rgba(0,0,0,0.3);
    border-right:6px solid var(--orange);
    transition:transform .12s ease;
  }
  .mode-btn:active{transform:scale(0.98);}
  .mode-btn .mode-label{font-family:'Heebo',sans-serif; font-weight:800; font-size:19px;}
  .mode-btn .mode-desc{font-size:13px; color:var(--concrete-dark); margin-top:2px;}
  .mode-btn .arrow{font-family:'Roboto Mono',monospace; font-size:20px; color:var(--orange);}

  .level-label-row{font-size:12px; color:var(--concrete); text-align:center; letter-spacing:1px;}
  .level-row{display:flex; gap:8px;}
  .level-btn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:14px 6px;
    font-family:'Heebo',sans-serif;
    font-weight:800;
    font-size:15px;
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
  }
  .level-btn.easy{background:var(--green);}
  .level-btn.medium{background:var(--orange);}
  .level-btn.hard{background:var(--red);}
  .level-btn:active{filter:brightness(0.9); transform:scale(0.98);}
  .ghost-btn{
    background:transparent;
    border:1.5px dashed rgba(241,239,230,0.4);
    color:var(--chalk);
    border-radius:10px;
    padding:12px 16px;
    font-family:'Assistant', sans-serif;
    font-size:14px;
    cursor:pointer;
    width:100%;
  }
  .ghost-btn:active{background:rgba(241,239,230,0.08);}
  .primary-btn{
    background:var(--orange);
    color:var(--navy-deep);
    border:none;
    border-radius:10px;
    padding:14px 18px;
    font-family:'Heebo', sans-serif;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    width:100%;
  }
  .primary-btn:active{background:var(--orange-deep);}
  .primary-btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* work order ticket */
  .ticket{
    background:var(--chalk);
    color:var(--navy-deep);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
  }
  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--navy-deep);
    color:var(--chalk);
    padding:7px 14px;
    font-family:'Roboto Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
  }
  .ticket-head .streak{color:var(--orange); font-weight:700;}
  .ticket-body{
    padding:14px 18px 12px;
    border-bottom:2px dashed var(--concrete-dark);
    text-align:center;
  }
  .op-tag{
    display:inline-block;
    font-family:'Roboto Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:#fff;
    background:var(--orange);
    padding:2px 9px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .op-tag.easy{background:var(--green);}
  .op-tag.medium{background:var(--orange);}
  .op-tag.hard{background:var(--red);}
  .question-text{
    font-family:'Heebo', sans-serif;
    font-weight:700;
    font-size:16px;
    line-height:1.4;
  }
  .ticket-foot{padding:12px 16px 14px;}
  .answer-display{
    width:100%;
    font-family:'Roboto Mono', monospace;
    font-size:24px;
    font-weight:700;
    text-align:center;
    padding:9px 10px;
    border-radius:9px;
    border:2px solid var(--concrete-dark);
    background:#fff;
    color:var(--navy-deep);
    letter-spacing:2px;
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .answer-display.empty{color:var(--concrete-dark); font-size:14px; font-weight:500; letter-spacing:normal; font-family:'Assistant',sans-serif;}
  .answer-display.correct{border-color:var(--green); background:#E8F7EE;}
  .answer-display.wrong{border-color:var(--red); background:#FBE9E8;}

  .keypad{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
    margin-top:8px;
  }
  .key{
    font-family:'Roboto Mono', monospace;
    font-size:17px;
    font-weight:700;
    padding:9px 0;
    border-radius:9px;
    border:none;
    background:var(--concrete);
    color:var(--navy-deep);
    cursor:pointer;
  }
  .key:active{background:var(--concrete-dark);}
  .key.del{background:#DDD8CC; font-size:14px;}
  .key.go{grid-column:span 4; background:var(--orange); color:#fff; font-family:'Heebo',sans-serif; font-size:15px;}
  .key.go:active{background:var(--orange-deep);}
  .key:disabled{opacity:0.5; cursor:not-allowed;}

  .stat-row{display:flex; justify-content:space-between; align-items:center; padding:0 4px;}
  .stat{text-align:center; flex:1;}
  .stat .num{font-family:'Roboto Mono', monospace; font-weight:700; font-size:18px; color:var(--chalk);}
  .stat .lbl{font-size:10px; color:var(--concrete); letter-spacing:1px;}

  /* concrete mixer + hourglass timer */
  .mixer-wrap{
    background:var(--navy-deep);
    border-radius:9px;
    padding:6px 10px 4px;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .mixer-drum{
    transform-origin:50% 50%;
    animation:spin 2.2s linear infinite;
  }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .pour-dot{
    animation:pour 0.9s linear infinite;
  }
  .pour-dot:nth-child(2){ animation-delay:0.3s; }
  .pour-dot:nth-child(3){ animation-delay:0.6s; }
  @keyframes pour{
    0%{ opacity:0; transform:translateY(0); }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ opacity:0; transform:translateY(8px); }
  }
  #topSand, #bottomSand{ transition:y 1s linear, height 1s linear, fill 0.4s ease; }
  .tape-time{
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    font-size:11px;
    color:var(--concrete);
    margin-top:2px;
    letter-spacing:1px;
  }

  .name-input{
    width:100%;
    font-family:'Assistant', sans-serif;
    font-size:17px;
    padding:13px 14px;
    border-radius:10px;
    border:2px solid var(--concrete-dark);
    text-align:right;
  }
  .name-input:focus{outline:none; border-color:var(--orange);}

  .result-score{
    font-family:'Heebo', sans-serif;
    font-weight:900;
    font-size:52px;
    text-align:center;
    color:var(--orange);
    line-height:1;
  }
  .result-score-lbl{
    text-align:center;
    font-size:13px;
    color:var(--concrete-dark);
    letter-spacing:1px;
    margin-top:4px;
  }
  .rank-badge{
    display:block;
    text-align:center;
    font-family:'Roboto Mono', monospace;
    font-size:14px;
    color:var(--navy-deep);
    background:var(--concrete);
    border-radius:20px;
    padding:6px 14px;
    margin:14px auto 0;
    width:fit-content;
  }

  .lb-list{list-style:none; display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .lb-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    background:rgba(255,255,255,0.6);
  }
  .lb-row.me{background:#FFE3CC; border:1.5px solid var(--orange);}
  .lb-rank{
    font-family:'Roboto Mono', monospace;
    font-weight:700;
    width:26px;
    text-align:center;
    color:var(--orange-deep);
  }
  .lb-name{flex:1; font-weight:600; font-size:14px;}
  .lb-score{font-family:'Roboto Mono', monospace; font-weight:700;}
  .lb-empty{text-align:center; color:var(--concrete-dark); font-size:14px; padding:10px 0;}

  .flash-fb{
    text-align:center;
    font-family:'Heebo',sans-serif;
    font-weight:800;
    font-size:13px;
    height:16px;
    margin-top:4px;
  }
  .flash-fb.ok{color:var(--green);}
  .flash-fb.bad{color:var(--red);}

  .row2{display:flex; gap:10px;}
  .row2>*{flex:1;}
  .footnote{text-align:center; font-size:12px; color:var(--concrete-dark);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // ---------- data & storage helpers ----------
  const DIFF_LABEL = {easy:'קל', medium:'בינוני', hard:'קשה'};
  const DIFF_MULT = {easy:1, medium:1.3, hard:1.6};

  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function round2(n){ return Math.round(n*100)/100; }
  function fmtElev(n){ return round2(n).toFixed(2)+'+'; }
  function fmtNum(n){
    const r = round2(n);
    return (r % 1 === 0) ? String(r) : r.toFixed(2).replace(/0$/,'');
  }
  function pick(arr){ return arr[rand(0,arr.length-1)]; }

  const QUESTION_TYPES = [
    // --- EASY ---
    { diff:'easy', gen(){
        const a = rand(15,400), b = rand(15,400);
        const t = pick([
          (a,b)=>`לאתר הגיעו בבוקר ${a} שקי מלט, ובצהריים עוד ${b} שקים. כמה שקים הגיעו סה"כ?`,
          (a,b)=>`הריצוף בקומה א׳ הוא ${a} מ"ר, ובקומה ב׳ ${b} מ"ר. כמה מ"ר ריצוף סה"כ?`,
          (a,b)=>`הקבלן שילם ${a} ש"ח על חול ועוד ${b} ש"ח על אבן גרוס. מה סך ההוצאה?`
        ]);
        return {text:t(a,b), answer:a+b};
    }},
    { diff:'easy', gen(){
        const a = rand(200,900), b = rand(20,a-10);
        const t = pick([
          (a,b)=>`מתקציב של ${a} ש"ח הוצאתם ${b} ש"ח על חומרים. כמה נשאר בתקציב?`,
          (a,b)=>`במחסן היו ${a} מוטות ברזל, נלקחו ${b} לאתר. כמה מוטות נשארו במחסן?`,
          (a,b)=>`השטח הכולל לבנייה הוא ${a} מ"ר, מתוכם ${b} מ"ר כבר נבנו. כמה מ"ר נותרו?`
        ]);
        return {text:t(a,b), answer:a-b};
    }},
    { diff:'easy', gen(){
        const before = rand(80,400), after = before - rand(5,80);
        return {text:`היו ${before} יחידות דיור מתוכננות בפרויקט, היום נותרו בתכנית ${after} יחידות. כמה יחידות בוטלו?`, answer: before-after};
    }},
    { diff:'easy', gen(){
        const floors = rand(4,24), perFloor = rand(2,8);
        return {text:`בבניין ${floors} קומות, ובכל קומה ${perFloor} דירות. כמה דירות יש בבניין סה"כ?`, answer: floors*perFloor};
    }},
    { diff:'easy', gen(){
        const total = rand(500,3000), net = total - rand(50,400);
        return {text:`השטח הבנוי הכולל של הבניין הוא ${total} מ"ר, מתוכם ${net} מ"ר שטח דירות נטו. כמה מ"ר שטחים משותפים (חדרי מדרגות, מסדרונות וכו')?`, answer: total-net};
    }},
    // --- MEDIUM ---
    { diff:'medium', gen(){
        const a = rand(2,20)*10, b = rand(2,30);
        const t = pick([
          (a,b)=>`עלות ריצוף למ"ר היא ${a} ש"ח. כמה יעלה ריצוף של ${b} מ"ר?`,
          (a,b)=>`פועל אחד מניח ${a} מ"ר טיח ביום. כמה מ"ר יניחו ${b} פועלים באותו יום?`,
          (a,b)=>`משאית מובילה ${a} שקי מלט בכל נסיעה. כמה שקים ב-${b} נסיעות?`
        ]);
        return {text:t(a,b), answer:a*b};
    }},
    { diff:'medium', gen(){
        const b = rand(2,20), q = rand(4,90), a = b*q;
        const t = pick([
          (a,b)=>`יש לחלק ${a} מ"ר בין ${b} דירות שוות בגודלן. כמה מ"ר לדירה?`,
          (a,b)=>`תקציב של ${a} ש"ח מתחלק שווה בשווה בין ${b} קבלני משנה. כמה מקבל כל אחד?`,
          (a,b)=>`משאית הובילה בסה"כ ${a} שקי מלט ב-${b} נסיעות שוות. כמה שקים בכל נסיעה?`
        ]);
        return {text:t(a,b), answer:q};
    }},
    { diff:'medium', gen(){
        const pOpts = [5,10,15,20,25,30,40,50];
        const p = pick(pOpts), a = rand(1,50)*20;
        const t = pick([
          (a,p)=>`עמלת התיווך היא ${p}% מעסקה בשווי ${a} ש"ח. כמה שווה העמלה?`,
          (a,p)=>`ניתנה הנחה של ${p}% על חומרי בניין בשווי ${a} ש"ח. כמה ש"ח ההנחה?`,
          (a,p)=>`מע"מ בשיעור ${p}% נוסף לעסקה של ${a} ש"ח. כמה ש"ח יתווסף?`
        ]);
        return {text:t(a,p), answer: Math.round(a*p/100)};
    }},
    { diff:'medium', gen(){
        const ground = round2(rand(1000,3000)/100);
        const subMax = Math.min(1500, Math.round((ground-1)*100));
        const water = round2(ground - rand(50, subMax)/100);
        return {text:`גובה פני קרקע קיימת ${fmtElev(ground)}. מי תהום נמצאים בגובה ${fmtElev(water)}. מה עומק החפירה עד למי תהום?`, answer: round2(ground-water)};
    }},
    { diff:'medium', gen(){
        const floorH = pick([3, 3.2, 3.5, 4]);
        const floors = rand(5,20);
        const maxH = round2(floorH*floors);
        return {text:`גובה מקסימלי מותר לבנייה הוא ${fmtNum(maxH)} מ'. גובה קומה בתב"ע מוגדר ל-${fmtNum(floorH)} מ'. כמה קומות מותר לבנות?`, answer: floors};
    }},
    { diff:'medium', gen(){
        const ratioOpts = [0.5,0.6,0.7,0.8,1,1.2,1.5,2];
        const ratio = pick(ratioOpts), units = rand(3,40)*10;
        return {text:`יש ${units} יחידות דיור, תקן החניה הוא ${fmtNum(ratio)} לדירה. כמה חניות יש לתכנן?`, answer: Math.round(units*ratio)};
    }},
    { diff:'medium', gen(){
        const area = rand(5,400)*20;
        const pctOpts = [40,50,60,75,80,100,120,150,175,200];
        const p = pick(pctOpts);
        return {text:`שטח המגרש הוא ${area} מ"ר, ואחוז הבנייה המותר הוא ${p}%. כמה מ"ר שטח בנייה מותר על המגרש?`, answer: Math.round(area*p/100)};
    }},
    { diff:'medium', gen(){
        const dunam = rand(2,30), rate = pick([4,6,8,10,12,15,20]);
        return {text:`שטח המגרש הוא ${dunam} דונם, הצפיפות המותרת היא ${rate} יח"ד לדונם. כמה יחידות דיור מותר לבנות במגרש?`, answer: dunam*rate};
    }},
    { diff:'medium', gen(){
        const units = rand(10,120), size = pick([4,5,6]);
        return {text:`בפרויקט ${units} דירות, ובכל דירה חובה ממ"ד בשטח ${size} מ"ר. כמה מ"ר ממ"דים יש בסה"כ בפרויקט?`, answer: units*size};
    }},
    { diff:'medium', gen(){
        const units = rand(10,150), perUnit = rand(50,80)*10000, budget = units*perUnit;
        return {text:`תקציב הפרויקט הוא ${budget.toLocaleString('he')} ש"ח, ובו ${units} דירות. כמה עולה כל דירה בממוצע?`, answer: perUnit};
    }},
    // --- HARD ---
    { diff:'hard', gen(){
        const floorH = round2(rand(1000,4000)/100);
        const slab = pick([15,18,20,22,25]), fill = pick([5,8,10,12,15]);
        return {text:`גובה רצפה ${fmtElev(floorH)} מ'. מה גובה תחתית התקרה אם יש תקרת בטון בעובי ${slab} ס"מ ומילוי בעובי ${fill} ס"מ?`, answer: round2(floorH - slab/100 - fill/100)};
    }},
    { diff:'hard', gen(){
        const rights = rand(5,200)*20;
        const pctUsed = pick([10,20,25,30,40,50,60,70,75,80,90]);
        const built = Math.round(rights*pctUsed/100);
        return {text:`זכויות הבנייה במגרש הן ${rights} מ"ר. עד כה נבנו ${built} מ"ר. כמה אחוזים מזכויות הבנייה נוצלו עד כה?`, answer: pctUsed};
    }},
    { diff:'hard', gen(){
        const small = rand(2,15)*10, large = rand(2,15)*10;
        const rateSmall = pick([0.5,0.6,0.7]), rateLarge = pick([1,1.2,1.5]);
        return {text:`בפרויקט ${small} דירות קטנות בתקן חניה ${fmtNum(rateSmall)} לדירה, ו-${large} דירות גדולות בתקן חניה ${fmtNum(rateLarge)} לדירה. כמה חניות סה"כ נדרשות?`, answer: Math.round(small*rateSmall + large*rateLarge)};
    }},
    { diff:'hard', gen(){
        const cost = rand(1,20)*20000;
        const profit = pick([5,10,15,20,25,30,40,50]);
        const sale = cost + Math.round(cost*profit/100);
        return {text:`עלות בנייה של דירה הייתה ${cost.toLocaleString('he')} ש"ח. הדירה נמכרה ב-${sale.toLocaleString('he')} ש"ח. מה אחוז הרווח של הקבלן?`, answer: profit};
    }}
  ];

  function makeQuestion(diffFilter){
    const pool = diffFilter ? QUESTION_TYPES.filter(q => q.diff===diffFilter) : QUESTION_TYPES;
    const qt = pick(pool);
    const {text, answer} = qt.gen();
    return {diff: qt.diff, text, answer};
  }

  // week resets Saturday 23:59:59 -> new week starts Sunday 00:00 (local time)
  function getWeekId(d){
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    dt.setDate(dt.getDate() - dt.getDay()); // back up to this week's Sunday
    const y = dt.getFullYear(), m = String(dt.getMonth()+1).padStart(2,'0'), dd = String(dt.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }
  const weekId = getWeekId(new Date());
  const weekStartDate = new Date(weekId);
  const weekLabel = weekStartDate.toLocaleDateString('he', {day:'numeric', month:'numeric'});

  async function storGet(key, shared){
    try{ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
    catch(e){ return null; }
  }
  async function storSet(key, value, shared){
    try{ await window.storage.set(key, value, !!shared); return true; }
    catch(e){ return false; }
  }
  async function getLeaderboard(){
    const raw = await storGet('leaderboard:'+weekId, true);
    try{ return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }
  async function saveLeaderboard(arr){ await storSet('leaderboard:'+weekId, JSON.stringify(arr), true); }
  async function getPlayerName(){ return await storGet('player-name', false); }
  async function setPlayerName(n){ await storSet('player-name', n, false); }

  // ---------- app state ----------
  const app = document.getElementById('app');
  let state = { screen:'home' };

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    if(state.screen==='home') return renderHome();
    if(state.screen==='practice') return renderPlay(false);
    if(state.screen==='practice-summary') return renderPracticeSummary();
    if(state.screen==='comp-name') return renderCompName();
    if(state.screen==='comp-already') return renderCompAlready();
    if(state.screen==='comp-play') return renderPlay(true);
    if(state.screen==='comp-result') return renderCompResult();
    if(state.screen==='leaderboard') return renderLeaderboardScreen();
  }

  // ---------- HOME ----------
  function renderHome(){
    app.innerHTML = `
      <div class="eyebrow">אתר עבודה · חישוב מהיר</div>
      <h1 class="title">לוח חשבון אתר</h1>
      <p class="subtitle">תרגול חיבור, חיסור, כפל, חילוק ואחוזים — בדיוק החישובים של היום-יום בבנייה ובנדל"ן.</p>

      <div class="level-label-row">תרגול חופשי לפי רמה</div>
      <div class="level-row">
        <button class="level-btn easy" data-diff="easy">קל</button>
        <button class="level-btn medium" data-diff="medium">בינוני</button>
        <button class="level-btn hard" data-diff="hard">קשה</button>
      </div>

      <button class="mode-btn" data-go="comp-start">
        <div>
          <div class="mode-label">תחרות שבועית</div>
          <div class="mode-desc">2 דקות, כל הנושאים והרמות מעורבבים, ניסיון אחד לשבוע</div>
        </div>
        <div class="arrow">◂</div>
      </button>

      <button class="ghost-btn" data-go="leaderboard">טבלת המובילים השבוע ›</button>
    `;
    app.querySelectorAll('.level-btn').forEach(btn => {
      btn.onclick = () => startPractice(btn.dataset.diff);
    });
    app.querySelector('[data-go="comp-start"]').onclick = startCompetitionFlow;
    app.querySelector('[data-go="leaderboard"]').onclick = () => { state.screen='leaderboard'; render(); };
  }

  // ---------- shared play engine ----------
  function newRoundState(competition, diff){
    return {
      competition,
      diff: diff || null,
      score:0, streak:0, answered:0, correct:0,
      q: makeQuestion(diff),
      qStart: performance.now(),
      timeLeft: competition ? 120 : null,
      timerId: null,
      locked:false
    };
  }

  function startPractice(diff){
    state.screen='practice';
    state.round = newRoundState(false, diff);
    render();
  }

  async function startCompetitionFlow(){
    const name = await getPlayerName();
    const lb = await getLeaderboard();
    if(name && lb.find(r => r.name.toLowerCase()===name.toLowerCase())){
      state.screen='comp-already';
      state.compName = name;
      state.lb = lb;
      render();
      return;
    }
    if(name){
      state.compName = name;
      beginCompetitionPlay();
    } else {
      state.screen='comp-name';
      render();
    }
  }

  function renderCompName(){
    app.innerHTML = `
      <div class="eyebrow">תחרות שבועית</div>
      <h1 class="title">איך קוראים לך בטבלה?</h1>
      <div class="card">
        <input class="name-input" id="nameField" maxlength="18" placeholder="שם או כינוי לתחרות" />
      </div>
      <button class="primary-btn" id="startCompBtn">התחל תחרות · 3 דקות</button>
      <button class="ghost-btn" data-go="home">חזרה</button>
    `;
    const field = app.querySelector('#nameField');
    const btn = app.querySelector('#startCompBtn');
    field.focus();
    field.addEventListener('keydown', e => { if(e.key==='Enter') btn.click(); });
    btn.onclick = async () => {
      const v = field.value.trim();
      if(!v) { field.style.borderColor='var(--red)'; return; }
      await setPlayerName(v);
      state.compName = v;
      beginCompetitionPlay();
    };
    app.querySelector('[data-go="home"]').onclick = () => { state.screen='home'; render(); };
  }

  function renderCompAlready(){
    const lb = state.lb.slice().sort((a,b)=>b.score-a.score);
    const idx = lb.findIndex(r => r.name.toLowerCase()===state.compName.toLowerCase());
    app.innerHTML = `
      <div class="eyebrow">תחרות שבועית</div>
      <h1 class="title">כבר התחרית השבוע</h1>
      <p class="subtitle">ניסיון אחד לשבוע — הניקוד שלך נשמר. חוזרים ביום א׳ הקרוב לתחרות חדשה.</p>
      <div class="card">
        <div class="result-score">${lb[idx].score}</div>
        <div class="result-score-lbl">הניקוד שלך השבוע</div>
        <div class="rank-badge">מקום ${idx+1} מתוך ${lb.length}</div>
      </div>
      <button class="ghost-btn" data-go="leaderboard">לצפייה בטבלה המלאה</button>
      <button class="ghost-btn" data-go="home">חזרה לבית</button>
    `;
    app.querySelector('[data-go="leaderboard"]').onclick = () => { state.screen='leaderboard'; render(); };
    app.querySelector('[data-go="home"]').onclick = () => { state.screen='home'; render(); };
  }

  function beginCompetitionPlay(){
    state.screen='comp-play';
    state.round = newRoundState(true);
    render();
    tickTimer();
  }

  function tickTimer(){
    const r = state.round;
    r.timerId = setInterval(() => {
      r.timeLeft -= 1;
      updateTimerVisual();
      if(r.timeLeft <= 0){
        clearInterval(r.timerId);
        endCompetition();
      }
    }, 1000);
  }

  function updateTimerVisual(){
    const topSand = document.getElementById('topSand');
    const botSand = document.getElementById('bottomSand');
    const label = document.getElementById('tapeTime');
    if(!topSand || !botSand || !label) return;
    const frac = Math.max(0, state.round.timeLeft/120);
    const danger = state.round.timeLeft <= 30;
    const sandColor = danger ? 'var(--red)' : 'var(--concrete)';
    const topH = 22*frac;
    topSand.setAttribute('y', 28-topH);
    topSand.setAttribute('height', topH);
    topSand.setAttribute('fill', sandColor);
    const botH = 22*(1-frac);
    botSand.setAttribute('y', 30);
    botSand.setAttribute('height', botH);
    botSand.setAttribute('fill', sandColor);
    const m = Math.floor(state.round.timeLeft/60), s = state.round.timeLeft%60;
    label.textContent = `${m}:${String(s).padStart(2,'0')} נותרו`;
    label.style.color = danger ? 'var(--red)' : 'var(--concrete)';
  }

  async function endCompetition(){
    const lb = await getLeaderboard();
    lb.push({name: state.compName, score: state.round.score, ts: Date.now()});
    await saveLeaderboard(lb);
    state.finalLb = lb;
    state.screen='comp-result';
    render();
  }

  function mixerTimerHtml(){
    return `
      <div class="mixer-wrap">
        <svg width="76" height="58" viewBox="0 0 100 76">
          <g class="mixer-drum" transform="translate(50,14)">
            <ellipse cx="0" cy="0" rx="16" ry="10" fill="var(--orange)"/>
            <path d="M -16,0 A16,10 0 0 0 16,0" fill="none" stroke="var(--orange-deep)" stroke-width="2"/>
            <line x1="-11" y1="-6" x2="11" y2="6" stroke="var(--orange-deep)" stroke-width="1.5"/>
            <line x1="11" y1="-6" x2="-11" y2="6" stroke="var(--orange-deep)" stroke-width="1.5"/>
          </g>
          <rect x="38" y="18" width="4" height="6" fill="var(--concrete-dark)"/>
          <circle class="pour-dot" cx="50" cy="26" r="1.6" fill="var(--concrete)"/>
          <circle class="pour-dot" cx="50" cy="26" r="1.6" fill="var(--concrete)"/>
          <circle class="pour-dot" cx="50" cy="26" r="1.6" fill="var(--concrete)"/>
          <defs>
            <clipPath id="topClip"><polygon points="20,6 80,6 50,28"/></clipPath>
            <clipPath id="bottomClip"><polygon points="20,52 80,52 50,30"/></clipPath>
          </defs>
          <rect id="topSand" x="10" y="6" width="80" height="22" clip-path="url(#topClip)" fill="var(--concrete)"/>
          <rect id="bottomSand" x="10" y="30" width="80" height="0" clip-path="url(#bottomClip)" fill="var(--concrete)"/>
          <polygon points="20,6 80,6 50,28" fill="none" stroke="var(--line)" stroke-width="2"/>
          <polygon points="20,52 80,52 50,30" fill="none" stroke="var(--line)" stroke-width="2"/>
        </svg>
        <div class="tape-time" id="tapeTime">2:00 נותרו</div>
      </div>`;
  }

  // ---------- PLAY SCREEN (shared by practice & competition) ----------
  function renderPlay(competition){
    const r = state.round;
    app.innerHTML = `
      ${competition ? mixerTimerHtml() : ''}

      <div class="stat-row">
        <div class="stat"><div class="num" id="scoreNum">${r.score}</div><div class="lbl">ניקוד</div></div>
        <div class="stat"><div class="num" id="streakNum">${r.streak}</div><div class="lbl">רצף</div></div>
        <div class="stat"><div class="num" id="answeredNum">${r.answered}</div><div class="lbl">שאלות</div></div>
      </div>

      <div class="ticket">
        <div class="ticket-head">
          <span>דף עבודה #<span id="qnum">${r.answered+1}</span></span>
          <span class="streak">${r.streak>0 ? 'רצף ×'+r.streak : ''}</span>
        </div>
        <div class="ticket-body">
          <div class="op-tag ${r.q.diff}" id="opTag">${DIFF_LABEL[r.q.diff]}</div>
          <div class="question-text" id="qText">${esc(r.q.text)}</div>
        </div>
        <div class="ticket-foot">
          <div class="answer-display empty" id="ansDisplay">הקש תשובה</div>
          <div class="flash-fb" id="flashFb"></div>
          <div class="keypad" id="keypad">
            <button class="key" data-k="1">1</button>
            <button class="key" data-k="2">2</button>
            <button class="key" data-k="3">3</button>
            <button class="key" data-k=".">.</button>
            <button class="key" data-k="4">4</button>
            <button class="key" data-k="5">5</button>
            <button class="key" data-k="6">6</button>
            <button class="key del" data-k="del">⌫</button>
            <button class="key" data-k="7">7</button>
            <button class="key" data-k="8">8</button>
            <button class="key" data-k="9">9</button>
            <button class="key" data-k="0">0</button>
            <button class="key go" data-k="go">אישור ✓</button>
          </div>
        </div>
      </div>

      ${!competition ? '<button class="ghost-btn" id="endPracticeBtn">סיים תרגול</button>' : ''}
    `;

    state.typed = '';
    app.querySelector('#keypad').addEventListener('click', e => {
      const btn = e.target.closest('.key');
      if(!btn || btn.disabled) return;
      const k = btn.dataset.k;
      if(k==='go'){ submitAnswer(competition); return; }
      if(k==='del'){ state.typed = state.typed.slice(0,-1); }
      else if(k==='.'){ if(!state.typed.includes('.')) state.typed += (state.typed ? '.' : '0.'); }
      else if(state.typed.length < 9){ state.typed += k; }
      updateAnswerDisplay();
    });

    if(!competition){
      app.querySelector('#endPracticeBtn').onclick = () => {
        state.screen='practice-summary';
        render();
      };
    }
  }

  function updateAnswerDisplay(){
    const disp = document.getElementById('ansDisplay');
    if(!disp) return;
    if(state.typed){
      disp.textContent = state.typed;
      disp.classList.remove('empty');
    } else {
      disp.textContent = 'הקש תשובה';
      disp.classList.add('empty');
    }
  }

  function submitAnswer(competition){
    const r = state.round;
    if(r.locked) return;
    if(competition && r.timeLeft<=0) return;
    if(!state.typed) return;
    r.locked = true;

    const val = parseFloat(state.typed);
    const elapsedSec = (performance.now() - r.qStart)/1000;
    const isCorrect = !isNaN(val) && Math.abs(val - r.q.answer) < 0.005;

    let pts = 0;
    if(isCorrect){
      const base = Math.max(20, Math.round((100 - elapsedSec*12) * DIFF_MULT[r.q.diff]));
      const streakBonus = Math.min(50, r.streak*5);
      pts = base + streakBonus;
      r.streak += 1;
      r.correct += 1;
    } else {
      r.streak = 0;
    }
    r.score += pts;
    r.answered += 1;

    const disp = document.getElementById('ansDisplay');
    disp.classList.add(isCorrect ? 'correct' : 'wrong');
    app.querySelectorAll('.key').forEach(k => k.disabled = true);
    const fb = document.getElementById('flashFb');
    fb.className = 'flash-fb ' + (isCorrect ? 'ok' : 'bad');
    fb.textContent = isCorrect ? `נכון! +${pts} נק'` : `לא נכון — התשובה: ${fmtNum(r.q.answer)}`;

    document.getElementById('scoreNum').textContent = r.score;
    document.getElementById('streakNum').textContent = r.streak;
    document.getElementById('answeredNum').textContent = r.answered;

    setTimeout(() => {
      if(competition && r.timeLeft<=0) return; // timer already ended round
      r.q = makeQuestion(r.diff);
      r.qStart = performance.now();
      r.locked = false;
      render();
      if(competition) updateTimerVisual();
    }, isCorrect ? 550 : 1100);
  }

  // ---------- practice summary ----------
  function renderPracticeSummary(){
    const r = state.round;
    const acc = r.answered ? Math.round((r.correct/r.answered)*100) : 0;
    app.innerHTML = `
      <div class="eyebrow">תרגול חופשי · ${DIFF_LABEL[r.diff]} · סיכום</div>
      <h1 class="title">עבודה טובה</h1>
      <div class="card">
        <div class="result-score">${r.score}</div>
        <div class="result-score-lbl">ניקוד בתרגול (לא נשמר)</div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="num">${r.answered}</div><div class="lbl">שאלות</div></div>
        <div class="stat"><div class="num">${acc}%</div><div class="lbl">דיוק</div></div>
        <div class="stat"><div class="num">${r.streak}</div><div class="lbl">רצף אחרון</div></div>
      </div>
      <button class="primary-btn" id="again">עוד סיבוב באותה רמה</button>
      <button class="ghost-btn" data-go="home">חזרה לבית</button>
    `;
    app.querySelector('#again').onclick = () => startPractice(r.diff);
    app.querySelector('[data-go="home"]').onclick = () => { state.screen='home'; render(); };
  }

  // ---------- competition result ----------
  function renderCompResult(){
    const r = state.round;
    const lb = state.finalLb.slice().sort((a,b)=>b.score-a.score);
    const idx = lb.findIndex(x => x.name===state.compName && x.score===r.score);
    app.innerHTML = `
      <div class="eyebrow">תחרות שבועית · תוצאה סופית</div>
      <h1 class="title">הזמן נגמר</h1>
      <div class="card">
        <div class="result-score">${r.score}</div>
        <div class="result-score-lbl">ניקוד סופי · ${r.answered} שאלות · ${r.correct} נכונות</div>
        <div class="rank-badge">מקום ${idx+1} מתוך ${lb.length} השבוע</div>
      </div>
      ${leaderboardListHtml(lb, state.compName)}
      <button class="ghost-btn" data-go="home">חזרה לבית</button>
    `;
    app.querySelector('[data-go="home"]').onclick = () => { state.screen='home'; render(); };
  }

  // ---------- leaderboard-only screen ----------
  async function renderLeaderboardScreen(){
    app.innerHTML = `
      <div class="eyebrow">שבוע החל ${weekLabel}</div>
      <h1 class="title">טבלת המובילים</h1>
      <div class="card" id="lbCard">טוען...</div>
      <button class="ghost-btn" data-go="home">חזרה לבית</button>
    `;
    app.querySelector('[data-go="home"]').onclick = () => { state.screen='home'; render(); };
    const lb = (await getLeaderboard()).slice().sort((a,b)=>b.score-a.score);
    const myName = await getPlayerName();
    document.getElementById('lbCard').outerHTML = leaderboardListHtml(lb, myName, true);
  }

  function leaderboardListHtml(lb, myName, standalone){
    if(!lb.length){
      return `<div class="card"><div class="lb-empty">עדיין אין תוצאות השבוע — היו הראשונים להתחרות.</div></div>`;
    }
    const rows = lb.map((r,i) => `
      <li class="lb-row ${myName && r.name.toLowerCase()===myName.toLowerCase() ? 'me' : ''}">
        <span class="lb-rank">${i+1}</span>
        <span class="lb-name">${esc(r.name)}</span>
        <span class="lb-score">${r.score}</span>
      </li>
    `).join('');
    return `<div class="card"><ul class="lb-list">${rows}</ul></div>`;
  }

  render();
})();
</script>
</body>
</html>

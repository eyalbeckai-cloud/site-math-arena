<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="א.ב. מתמטיקה שימושית">
<meta name="theme-color" content="#0B0B0B">
<title>א.ב. מתמטיקה שימושית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E1261C;
    --red-dark:#A81810;
    --green:#007A3D;
    --green-dark:#005B2D;
    --ink:#0B0B0B;
    --ink-2:#161616;
    --ink-3:#242424;
    --paper:#FFFFFF;
    --paper-2:#F3F1EC;
    --muted:#5E5E5E;
    --muted-light:#B9B6AF;
    --gold:#C8A24A;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Assistant', sans-serif;
    font-size:16px;
    background:
      radial-gradient(circle at 50% 0%, #1E1E1E 0%, var(--ink) 60%),
      var(--ink);
    color:var(--paper);
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }

  /* ===== brand bar ===== */
  .brandbar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding-bottom:4px;
  }
  .brandmark{
    width:38px; height:44px;
    background:var(--red);
    clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Heebo',sans-serif; font-weight:900; font-size:15px; color:#fff;
    letter-spacing:-0.5px;
    flex-shrink:0;
  }
  .brandname{
    font-family:'Heebo',sans-serif; font-weight:900;
    font-size:clamp(22px, 5.5vw, 34px);
    letter-spacing:-0.5px; line-height:1.1;
  }
  .rule{
    height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--red) 0 33%, var(--paper) 33% 66%, var(--green) 66% 100%);
    opacity:0.9;
  }

  /* ===== layout ===== */
  #app{
    width:100%;
    max-width:520px;
    display:flex; flex-direction:column; gap:11px;
    margin:0 auto;
  }
  #app.wide{max-width:920px;}
  @media (min-width:900px){
    body{padding:36px 24px;}
    .home-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:22px; align-items:start;}
    .home-hero{padding:8px 0;}
  }

  h1.title{
    font-family:'Heebo', sans-serif; font-weight:900;
    font-size:clamp(26px, 6vw, 40px);
    line-height:1.15; letter-spacing:-0.5px;
    text-align:center;
  }
  .lead{
    text-align:center; font-size:clamp(16px,4vw,19px);
    line-height:1.55; color:#EDEBE6; font-weight:600;
  }
  .sub{
    text-align:center; font-size:clamp(14.5px,3.6vw,17px);
    line-height:1.55; color:var(--muted-light);
  }
  @media (min-width:900px){
    h1.title, .lead, .sub{text-align:right;}
  }

  /* ===== cards ===== */
  .panel{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 14px 30px rgba(0,0,0,0.45);
    border-top:5px solid var(--red);
  }
  .panel.green-top{border-top-color:var(--green);}
  .panel-title{
    font-family:'Heebo',sans-serif; font-weight:900;
    font-size:20px; margin-bottom:4px;
  }
  .panel-desc{font-size:15px; color:var(--muted); line-height:1.5; margin-bottom:14px;}

  .level-row{display:flex; gap:10px;}
  .level-btn{
    flex:1; border:none; border-radius:12px;
    padding:16px 6px;
    font-family:'Heebo',sans-serif; font-weight:800; font-size:17px;
    color:#fff; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.22);
  }
  .level-btn.easy{background:var(--green);}
  .level-btn.medium{background:var(--gold); color:#2A2000;}
  .level-btn.hard{background:var(--red);}
  .level-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.22);}

  .cta{
    width:100%; border:none; border-radius:12px;
    background:var(--green); color:#fff;
    font-family:'Heebo',sans-serif; font-weight:800; font-size:18px;
    padding:16px; cursor:pointer;
    box-shadow:0 4px 0 var(--green-dark);
  }
  .cta:active{transform:translateY(2px); box-shadow:0 2px 0 var(--green-dark);}
  .cta.red{background:var(--red); box-shadow:0 4px 0 var(--red-dark);}
  .cta.red:active{box-shadow:0 2px 0 var(--red-dark);}

  .ghost{
    width:100%; border:2px solid rgba(255,255,255,0.28);
    background:transparent; color:var(--paper);
    border-radius:12px; padding:14px;
    font-family:'Assistant',sans-serif; font-weight:600; font-size:16px;
    cursor:pointer;
  }
  .ghost:active{background:rgba(255,255,255,0.08);}
  .ghost.small{padding:11px; font-size:15px;}

  /* ===== play screen ===== */
  .qhead{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Roboto Mono',monospace; font-size:14px;
    color:var(--muted-light); padding:0 2px;
  }
  .qhead .streak{color:var(--gold); font-weight:700;}

  .qcard{
    background:var(--paper); color:var(--ink);
    border-radius:var(--radius);
    padding:14px 16px 13px;
    box-shadow:0 14px 30px rgba(0,0,0,0.45);
    text-align:center;
    border-top:5px solid var(--red);
  }
  .diff-tag{
    display:inline-block;
    font-family:'Heebo',sans-serif; font-weight:800;
    font-size:13px; letter-spacing:1px; color:#fff;
    padding:4px 14px; border-radius:20px; margin-bottom:10px;
  }
  .diff-tag.easy{background:var(--green);}
  .diff-tag.medium{background:var(--gold); color:#2A2000;}
  .diff-tag.hard{background:var(--red);}
  .qtext{
    font-family:'Heebo',sans-serif; font-weight:700;
    font-size:clamp(17px,4.4vw,21px); line-height:1.45;
  }

  .answer-bar{
    background:var(--ink-2);
    border:2px solid rgba(255,255,255,0.18);
    border-radius:12px;
    min-height:50px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Roboto Mono',monospace; font-weight:700;
    font-size:30px; letter-spacing:2px; color:#fff;
    padding:8px;
  }
  .answer-bar.empty{
    font-family:'Assistant',sans-serif; font-size:16px;
    letter-spacing:normal; color:var(--muted-light); font-weight:500;
  }
  .answer-bar.correct{border-color:var(--green); background:rgba(0,122,61,0.22);}
  .answer-bar.wrong{border-color:var(--red); background:rgba(225,38,28,0.18);}

  .fb{
    text-align:center; font-family:'Heebo',sans-serif; font-weight:800;
    font-size:15px; min-height:19px;
  }
  .date-hint{
    font-family:'Roboto Mono',monospace; font-size:13px;
    color:var(--muted); margin-top:8px; direction:ltr;
  }
  .fb.ok{color:#5BD48B;}
  .fb.bad{color:#FF7A72;}

  /* ===== dialer keypad ===== */
  .keypad{
    display:grid;
    grid-template-columns:repeat(3, clamp(58px,16vw,68px));
    justify-content:center;
    gap:clamp(8px,2.4vw,12px);
    direction:ltr;            /* 1-2-3 left to right, like a real dialer */
    margin:0 auto; width:100%;
  }
  .key{
    width:clamp(58px,16vw,68px); height:clamp(58px,16vw,68px);
    border:none; border-radius:50%;
    background:var(--ink-3); color:#fff;
    font-family:'Heebo',sans-serif; font-weight:500;
    font-size:clamp(23px,6.2vw,27px);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .1s;
  }
  .key:active{background:#3C3C3C;}
  .key:disabled{opacity:0.45;}
  .action-row{
    display:flex; justify-content:center; align-items:center;
    gap:clamp(20px,8vw,42px);
    margin-top:2px;
  }
  .action-key{
    width:clamp(58px,16vw,68px); height:clamp(58px,16vw,68px);
    border:none; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px;
    font-family:'Heebo',sans-serif; font-weight:800; font-size:13px;
    color:#fff; cursor:pointer;
  }
  .action-key .glyph{font-size:26px; line-height:1;}
  .action-key.ok{background:var(--green); box-shadow:0 5px 0 var(--green-dark);}
  .action-key.ok:active{transform:translateY(2px); box-shadow:0 3px 0 var(--green-dark);}
  .action-key.del{background:var(--ink-3); box-shadow:0 5px 0 #101010;}
  .action-key.del:active{transform:translateY(2px); box-shadow:0 3px 0 #101010;}
  .action-key:disabled{opacity:0.45;}

  /* ===== crane timer ===== */
  .crane-wrap{
    background:linear-gradient(180deg,#171717,#0E0E0E);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:8px 12px 6px;
    display:flex; align-items:center; gap:12px;
  }
  .crane-svg{width:clamp(140px,42vw,190px); height:auto; flex-shrink:0;}
  .crane-clock{flex:1; text-align:center;}
  .crane-clock .t{
    font-family:'Roboto Mono',monospace; font-weight:700;
    font-size:clamp(26px,8vw,34px); color:#fff; line-height:1;
  }
  .crane-clock .l{font-size:13px; color:var(--muted-light); letter-spacing:1px; margin-top:4px;}
  .crane-clock.danger .t{color:#FF7A72; animation:pulse .9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .trolley{animation:trolley 5.5s ease-in-out infinite;}
  @keyframes trolley{0%,100%{transform:translateX(0);}50%{transform:translateX(-62px);}}
  .hookload{animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(7px);}}
  #bldgRect, #bldgTop{transition:y .9s linear, height .9s linear;}

  /* ===== results / leaderboard ===== */
  .bigscore{
    font-family:'Heebo',sans-serif; font-weight:900;
    font-size:58px; text-align:center; color:var(--red); line-height:1;
  }
  .bigscore-l{text-align:center; font-size:15px; color:var(--muted); margin-top:6px;}
  .rankpill{
    display:block; width:fit-content; margin:14px auto 0;
    background:var(--ink); color:#fff;
    font-family:'Heebo',sans-serif; font-weight:800; font-size:15px;
    padding:8px 18px; border-radius:22px;
  }
  .stat-row{display:flex; gap:8px;}
  .stat{
    flex:1; text-align:center; background:rgba(255,255,255,0.07);
    border-radius:10px; padding:10px 4px;
  }
  .stat .n{font-family:'Roboto Mono',monospace; font-weight:700; font-size:22px; color:#fff;}
  .stat .l{font-size:13px; color:var(--muted-light); margin-top:2px;}

  .lb{list-style:none; display:flex; flex-direction:column; gap:8px;}
  .lb li{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border-radius:10px;
    background:var(--paper-2); font-size:16px;
  }
  .lb li.me{background:#FFE7E5; box-shadow:inset 0 0 0 2px var(--red);}
  .lb .r{font-family:'Roboto Mono',monospace; font-weight:700; width:28px; text-align:center; color:var(--red-dark); font-size:17px;}
  .lb .n{flex:1; font-weight:700;}
  .lb .s{font-family:'Roboto Mono',monospace; font-weight:700; font-size:17px;}
  .lb-empty{text-align:center; color:var(--muted); font-size:16px; padding:12px 0;}

  .name-input{
    width:100%; font-family:'Assistant',sans-serif; font-size:19px;
    padding:15px 16px; border-radius:12px;
    border:2px solid #D6D2C9; text-align:right; color:var(--ink);
  }
  .name-input:focus{outline:none; border-color:var(--green);}

  /* scoring page */
  .score-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #E5E1D8; align-items:flex-start;}
  .score-item:last-child{border-bottom:none;}
  .score-badge{
    flex-shrink:0; width:44px; height:44px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Heebo',sans-serif; font-weight:900; font-size:15px; color:#fff;
  }
  .score-item h4{font-family:'Heebo',sans-serif; font-size:17px; margin-bottom:3px;}
  .score-item p{font-size:15px; color:var(--muted); line-height:1.5;}
  .formula{
    background:var(--ink); color:#fff; border-radius:10px;
    padding:14px; text-align:center; margin-top:14px;
    font-family:'Roboto Mono',monospace; font-size:14px; line-height:1.7;
  }
  .footnote{text-align:center; font-size:14px; color:var(--muted-light); line-height:1.5;}

  /* ===== profile avatar (all screens) ===== */
  .avatar{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    left:14px;
    width:38px; height:38px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,0.9);
    box-shadow:0 3px 10px rgba(0,0,0,0.55);
    z-index:100;
    background:var(--ink-3);
  }
  @media (min-width:900px){
    .avatar{width:46px; height:46px; top:20px; left:22px;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  const DIFF_LABEL = {easy:'קל', medium:'בינוני', hard:'קשה'};
  const DIFF_MULT  = {easy:1, medium:1.3, hard:1.6};
  const COMP_SECONDS = 120;

  function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function round2(n){ return Math.round(n*100)/100; }
  function fmtElev(n){ return round2(n).toFixed(2)+'+'; }
  function fmtNum(n){ const r=round2(n); return (r%1===0)?String(r):r.toFixed(2).replace(/0$/,''); }
  function pick(a){ return a[rand(0,a.length-1)]; }

  // ---- month/year helpers for licensing-timeline questions ----
  function mkMY(){ return {m:rand(1,12), y:rand(25,29)}; }          // y = 2-digit year
  function shiftMY(d, months){
    const t = d.y*12 + (d.m-1) + months;
    return {m:(t%12)+1, y:Math.floor(t/12)};
  }
  function sMY(d){ return String(d.m).padStart(2,'0')+'/'+String(d.y).padStart(2,'0'); }
  function mon(n){ return n===1 ? 'חודש' : n===2 ? 'חודשיים' : n+' חודשים'; }
  function normDate(s){
    const m=/^(\d{1,2})\/(\d{2,4})$/.exec(String(s).trim());
    if(!m) return null;
    const mm=parseInt(m[1],10);
    if(mm<1||mm>12) return null;
    let yy=m[2]; if(yy.length===4) yy=yy.slice(2);
    return String(mm).padStart(2,'0')+'/'+yy.padStart(2,'0');
  }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const QUESTION_TYPES = [
    // ---------- EASY ----------
    { diff:'easy', gen(){
        const a=rand(15,400), b=rand(15,400);
        const t=pick([
          (a,b)=>`לאתר הגיעו בבוקר ${a} שקי מלט, ובצהריים עוד ${b} שקים. כמה שקים הגיעו סה"כ?`,
          (a,b)=>`הריצוף בקומה א׳ הוא ${a} מ"ר, ובקומה ב׳ ${b} מ"ר. כמה מ"ר ריצוף סה"כ?`,
          (a,b)=>`הקבלן שילם ${a} ש"ח על חול ועוד ${b} ש"ח על אבן גרוס. מה סך ההוצאה?`
        ]);
        return {text:t(a,b), answer:a+b};
    }},
    { diff:'easy', gen(){
        const a=rand(200,900), b=rand(20,a-10);
        const t=pick([
          (a,b)=>`מתקציב של ${a} ש"ח הוצאתם ${b} ש"ח על חומרים. כמה נשאר בתקציב?`,
          (a,b)=>`במחסן היו ${a} מוטות ברזל, נלקחו ${b} לאתר. כמה מוטות נשארו במחסן?`,
          (a,b)=>`השטח הכולל לבנייה הוא ${a} מ"ר, מתוכם ${b} מ"ר כבר נבנו. כמה מ"ר נותרו?`
        ]);
        return {text:t(a,b), answer:a-b};
    }},
    { diff:'easy', gen(){
        const before=rand(80,400), after=before-rand(5,80);
        return {text:`היו ${before} יחידות דיור מתוכננות בפרויקט, היום נותרו בתכנית ${after} יחידות. כמה יחידות בוטלו?`, answer:before-after};
    }},
    { diff:'easy', gen(){
        const f=rand(4,24), p=rand(2,8);
        return {text:`בבניין ${f} קומות, ובכל קומה ${p} דירות. כמה דירות יש בבניין סה"כ?`, answer:f*p};
    }},
    { diff:'easy', gen(){
        const total=rand(500,3000), net=total-rand(50,400);
        return {text:`השטח הבנוי הכולל של הבניין הוא ${total} מ"ר, מתוכם ${net} מ"ר שטח דירות נטו. כמה מ"ר שטחים משותפים?`, answer:total-net};
    }},
    { diff:'easy', gen(){
        const rooms=rand(3,6), each=rand(8,30);
        return {text:`בדירה ${rooms} חדרים, בכל חדר ${each} מ"ר. מה שטח הדירה?`, answer:rooms*each};
    }},
    // ---------- MEDIUM ----------
    { diff:'medium', gen(){
        const a=rand(2,20)*10, b=rand(2,30);
        const t=pick([
          (a,b)=>`עלות ריצוף למ"ר היא ${a} ש"ח. כמה יעלה ריצוף של ${b} מ"ר?`,
          (a,b)=>`פועל אחד מניח ${a} מ"ר טיח ביום. כמה מ"ר יניחו ${b} פועלים באותו יום?`,

  function makeQuestion(diff){
    const pool = diff ? QUESTION_TYPES.filter(q=>q.diff===diff) : QUESTION_TYPES;
    const qt = pick(pool);
    const {text,answer} = qt.gen();
    return {diff:qt.diff, fmt:qt.fmt||'num', text, answer};
  }

  // ---------- week: Sunday 00:00 -> Saturday 23:59 ----------
  function getWeekId(d){
    const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    dt.setDate(dt.getDate()-dt.getDay());
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }
  const weekId = getWeekId(new Date());
  const weekLabel = new Date(weekId).toLocaleDateString('he',{day:'numeric',month:'numeric'});

  // ================= BACKEND =================
  // מצב משותף אמיתי: הדביקו כאן את כתובת ה-Realtime Database מ-Firebase.
  // דוגמה: "https://my-project-default-rtdb.firebaseio.com"
  const FIREBASE_DB_URL = "https://ebmathgame-default-rtdb.europe-west1.firebasedatabase.app";

  const APP_VERSION = "2026-08-22-v3";

  const MODE = FIREBASE_DB_URL ? 'firebase'
             : (typeof window.storage !== 'undefined' ? 'artifact' : 'local');

  function httpHint(s){
    if(s===401||s===403) return 'הרשאות נדחו — כללי ה-Rules חוסמים כתיבה/קריאה';
    if(s===404) return 'הכתובת לא נמצאה — ודאו Realtime Database (לא Firestore) ושהכתובת מדויקת';
    if(s===400) return 'בקשה שגויה';
    return '';
  }
  function wrapErr(e){
    if(e && e.name==='TypeError') return new Error('החיבור נחסם או שאין אינטרנט (CORS/רשת)');
    return e;
  }

  function nameKey(n){
    return n.trim().toLowerCase().replace(/[.$#\[\]\/]/g,'_').replace(/\s+/g,'_');
  }

  function dbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path + '.json'; }
  async function fbGet(path){
    let r;
    try{ r = await fetch(dbUrl(path)); }catch(e){ throw wrapErr(e); }
    if(!r.ok) throw new Error('HTTP ' + r.status + (httpHint(r.status)?' — '+httpHint(r.status):''));
    return await r.json();
  }
  async function fbPut(path, data){
    let r;
    try{
      r = await fetch(dbUrl(path), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    }catch(e){ throw wrapErr(e); }
    if(!r.ok) throw new Error('HTTP ' + r.status + (httpHint(r.status)?' — '+httpHint(r.status):''));
    return await r.json();
  }

  // local/artifact fallbacks
  let memStore = {};
  async function rawGet(k){
    if(MODE==='artifact'){ try{const r=await window.storage.get(k,true); return r?r.value:null;}catch(e){return null;} }
    try{ return localStorage.getItem(k); }catch(e){ return memStore[k]||null; }
  }
  async function rawSet(k,v){
    if(MODE==='artifact'){ try{await window.storage.set(k,v,true); return;}catch(e){return;} }
    try{ localStorage.setItem(k,v); }catch(e){ memStore[k]=v; }
  }

  // ---- leaderboard API (throws on real failure so the UI can report it) ----
  async function getLeaderboard(){
    if(MODE==='firebase'){
      const obj = await fbGet('leaderboard/'+weekId);
      return obj ? Object.values(obj) : [];
    }
    const raw = await rawGet('leaderboard:'+weekId);
    try{ return raw?JSON.parse(raw):[]; }catch(e){ return []; }
  }

  async function findEntry(name){
    if(MODE==='firebase'){
      return await fbGet('leaderboard/'+weekId+'/'+nameKey(name));
    }
    const lb = await getLeaderboard();
    return lb.find(r=>nameKey(r.name)===nameKey(name)) || null;
  }

  async function saveEntry(name, score){
    const entry = {name:name.trim(), score:score, ts:Date.now()};
    if(MODE==='firebase'){
      await fbPut('leaderboard/'+weekId+'/'+nameKey(name), entry);
      return entry;
    }
    const lb = await getLeaderboard();
    const i = lb.findIndex(r=>nameKey(r.name)===nameKey(name));
    if(i>=0) lb[i]=entry; else lb.push(entry);
    await rawSet('leaderboard:'+weekId, JSON.stringify(lb));
    return entry;
  }

    try{ return localStorage.getItem('player-name'); }catch(e){ return memStore['player-name']||null; }

  async function setPlayerName(n){

    L.push(['גרסת קובץ', APP_VERSION, 'info']);
    L.push(['מצב עבודה', MODE==='firebase'?'Firebase (טבלה משותפת)':'מקומי בלבד', MODE==='firebase'?'ok':'bad']);
    L.push(['כתובת DB', FIREBASE_DB_URL || '(ריק — לא הוזנה כתובת)', FIREBASE_DB_URL?'info':'bad']);
    L.push(['מזהה שבוע', weekId, 'info']);
    if(MODE!=='firebase'){
      L.push(['אבחנה','הקובץ שרץ כרגע לא מכיל כתובת Firebase. או שלא נשמרה, או שהועלה קובץ ישן, או שהדפדפן מציג גרסה מהמטמון.','bad']);
      return L;
    }
    try{ await fbPut('_diag/ping', {ts:Date.now()}); L.push(['כתיבה לבסיס','הצליחה','ok']); }
    catch(e){ L.push(['כתיבה לבסיס','נכשלה — '+e.message,'bad']); return L; }
    try{ const v=await fbGet('_diag/ping'); L.push(['קריאה מהבסיס', v?'הצליחה':'החזירה ריק', v?'ok':'bad']); }
    catch(e){ L.push(['קריאה מהבסיס','נכשלה — '+e.message,'bad']); }
    try{ const lb=await getLeaderboard(); L.push(['רשומות בטבלה השבוע', String(lb.length), 'info']); }
    catch(e){ L.push(['טעינת הטבלה','נכשלה — '+e.message,'bad']); }
    return L;
  }

    app.innerHTML = `

        </div>
      </div>`).join('');
    const slot=document.getElementById('diagSlot');
    if(slot) slot.innerHTML=html;
    const hb=app.querySelector('#home');
    if(hb) hb.onclick=()=>{state.screen='home'; render();};
  }

  // ================= SCORING PAGE =================
  function renderScoring(){
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">שיטת הניקוד</h1>
      <div class="panel">
        <div class="score-item">
          <div class="score-badge" style="background:var(--ink)">מהירות</div>
          <div>
            <h4>מהירות = נקודות</h4>
            <p>כל תשובה נכונה מתחילה ב-100 נקודות, ויורדות כ-12 נקודות על כל שנייה שחולפת. המינימום לתשובה נכונה הוא 20 נקודות — גם אם לקח זמן.</p>
          </div>
        </div>
        <div class="score-item">
          <div class="score-badge" style="background:var(--red)">רמה</div>
          <div>
            <h4>מכפיל לפי רמת קושי</h4>
            <p>קל ×1 · בינוני ×1.3 · קשה ×1.6. בתחרות מגיעות שאלות מכל הרמות, אז שאלה קשה שווה יותר.</p>
          </div>
        </div>
        <div class="score-item">
          <div class="score-badge" style="background:var(--gold);color:#2A2000">רצף</div>
          <div>
            <h4>בונוס רצף</h4>
            <p>כל תשובה נכונה ברצף מוסיפה 5 נקודות בונוס, עד תקרה של 50. טעות אחת מאפסת את הרצף.</p>
          </div>
        </div>
        <div class="score-item">
          <div class="score-badge" style="background:var(--green)">ניסיון</div>
          <div>
            <h4>ניסיון אחד לכל שאלה</h4>
            <p>אין אפשרות לתקן תשובה. טעות שווה 0 נקודות ומאפסת את הרצף — עדיף לוודא לפני שמאשרים.</p>
          </div>
        </div>
        <div class="formula">
          ניקוד = (100 − שניות×12) × מכפיל רמה + בונוס רצף
        </div>
      </div>
      <button class="ghost" id="back">חזרה לדף הבית</button>
    `;
    app.querySelector('#back').onclick=()=>{state.screen='home'; render();};
  }

  // ================= PLAY ENGINE =================
  function newRound(competition, diff){
    return {competition, diff:diff||null, score:0, streak:0, answered:0, correct:0,
            q:makeQuestion(diff), qStart:performance.now(),
            timeLeft: competition?COMP_SECONDS:null, timerId:null, locked:false};
  }

  function startPractice(diff){
    state.screen='practice';
    state.round=newRound(false,diff);
    render();
  }

  async function startCompetitionFlow(){
    const name=await getPlayerName();
    if(name){
      try{
        const e=await findEntry(name);
        if(e){ state.compName=name; state.entry=e; state.screen='comp-already'; render(); return; }
      }catch(err){ /* offline: let them try, the start below will report */ }
    }
    state.screen='comp-name'; render();
  }

  function renderCompName(){
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">כניסה לתחרות</h1>
      <p class="sub">2 דקות · ניסיון אחד לשבוע · הכינוי נרשם לטבלה מרגע ההתחלה.</p>
      <div class="panel">
        <div class="panel-title">הכינוי שלך בטבלה</div>
        <div class="panel-desc">כל כינוי יכול להתחרות פעם אחת בשבוע. אם תפרוש באמצע — הכינוי יישאר בטבלה עם 0 נקודות.</div>
        <input class="name-input" id="nameField" maxlength="18" placeholder="שם או כינוי" />
        <div id="nameErr" style="color:var(--red);font-size:15px;font-weight:700;margin-top:10px;line-height:1.4"></div>
      </div>
      ${modeNote()}
      <button class="cta red" id="go">התחל · 2 דקות</button>
      <button class="ghost" id="back">ביטול</button>
    `;
    const f=app.querySelector('#nameField'), g=app.querySelector('#go');
    f.focus();
    f.addEventListener('keydown',e=>{ if(e.key==='Enter') g.click(); });
    const errBox=app.querySelector('#nameErr');
    g.onclick=async()=>{
      const v=f.value.trim();
      if(!v){ f.style.borderColor='var(--red)'; return; }
      g.disabled=true; g.textContent='רושם…'; errBox.textContent='';
      try{
        const existing=await findEntry(v);
        if(existing){
          state.compName=v; state.entry=existing; state.screen='comp-already'; render(); return;
        }
        // reserve the slot immediately with 0 — quitting or closing leaves 0
        await saveEntry(v, 0);
        await setPlayerName(v);
        state.compName=v;
        beginCompetition();
      }catch(err){
        g.disabled=false; g.textContent='התחל · 2 דקות';
        errBox.textContent='לא הצלחנו להתחבר לטבלת התחרות ('+err.message+'). בדקו חיבור אינטרנט ונסו שוב.';
      }
    };
    app.querySelector('#back').onclick=()=>{state.screen='home'; render();};
  }

  function renderCompAlready(){
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">הכינוי כבר התחרה השבוע</h1>
      <p class="sub">ניסיון אחד לכל כינוי בשבוע. ביום ראשון נפתחת תחרות חדשה.</p>
      <div class="panel">
        <div class="bigscore">${state.entry.score}</div>
        <div class="bigscore-l">הניקוד של "${esc(state.entry.name)}" השבוע</div>
      </div>
      <button class="ghost" id="lb">לטבלה המלאה</button>
      <button class="ghost" id="home">חזרה לדף הבית</button>
    `;
    app.querySelector('#lb').onclick=()=>{state.screen='leaderboard'; render();};
    app.querySelector('#home').onclick=()=>{state.screen='home'; render();};
  }

  function beginCompetition(){
    state.screen='comp-play';
    state.round=newRound(true);
    render();
    updateTimerVisual();
    state.round.timerId=setInterval(()=>{
      state.round.timeLeft--;
      updateTimerVisual();
      if(state.round.timeLeft<=0){ clearInterval(state.round.timerId); finishCompetition(); }
    },1000);
  }

  async function finishCompetition(){
    state.saveError=null;
    try{
      await saveEntry(state.compName, state.round.score);
      state.finalLb = await getLeaderboard();
    }catch(err){
      state.saveError = err.message;
      state.finalLb = [];
    }
    state.screen='comp-result';
    render();
  }

  function quitCompetition(){
    if(!confirm('לפרוש מהתחרות? הכינוי שלך יישאר בטבלה עם 0 נקודות, ולא תוכל להתחרות שוב השבוע.')) return;
    clearInterval(state.round.timerId);
    state.round.score=0;
    state.quit=true;
    finishCompetition();
  }

  // ---------- crane timer ----------
  function craneHtml(){
    return `
      <div class="crane-wrap">
        <svg class="crane-svg" viewBox="0 0 260 140">
          <rect x="0" y="130" width="260" height="6" fill="#2B2B2B"/>
          <rect x="0" y="130" width="260" height="2" fill="var(--gold)"/>
          <defs>
            <pattern id="fl" width="18" height="14" patternUnits="userSpaceOnUse">
              <rect width="18" height="14" fill="#D9D5CC"/>
              <rect x="3" y="3" width="12" height="7" fill="#3E6C8E"/>
              <rect x="0" y="12.5" width="18" height="1.5" fill="#A9A498"/>
            </pattern>
          </defs>
          <rect id="bldgRect" x="26" y="130" width="96" height="0" fill="url(#fl)"/>
          <rect id="bldgTop" x="22" y="128" width="104" height="0" fill="var(--red)"/>
          <g stroke="var(--red)" stroke-width="3" fill="none" stroke-linecap="round">
            <line x1="184" y1="130" x2="184" y2="26"/>
            <line x1="202" y1="130" x2="202" y2="26"/>
            <line x1="184" y1="122" x2="202" y2="104"/><line x1="202" y1="122" x2="184" y2="104"/>
            <line x1="184" y1="104" x2="202" y2="86"/><line x1="202" y1="104" x2="184" y2="86"/>
            <line x1="184" y1="86" x2="202" y2="68"/><line x1="202" y1="86" x2="184" y2="68"/>
            <line x1="184" y1="68" x2="202" y2="50"/><line x1="202" y1="68" x2="184" y2="50"/>
            <line x1="184" y1="50" x2="202" y2="32"/><line x1="202" y1="50" x2="184" y2="32"/>
          </g>
          <rect x="178" y="14" width="30" height="12" rx="2" fill="var(--red)"/>
          <line x1="40" y1="20" x2="250" y2="20" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/>
          <line x1="40" y1="20" x2="193" y2="6" stroke="var(--red)" stroke-width="1.6"/>
          <line x1="250" y1="20" x2="193" y2="6" stroke="var(--red)" stroke-width="1.6"/>
          <line x1="193" y1="6" x2="193" y2="20" stroke="var(--red)" stroke-width="1.6"/>
          <rect x="238" y="14" width="20" height="14" rx="2" fill="#4A4A4A"/>
          <g class="trolley" transform="translate(120,0)">
            <rect x="-7" y="18" width="14" height="6" rx="1.5" fill="#4A4A4A"/>
            <g class="hookload">
              <line x1="0" y1="24" x2="0" y2="64" stroke="#8A8A8A" stroke-width="1.5"/>
              <path d="M -11,64 L 11,64 L 8,80 L -8,80 Z" fill="var(--green)"/>
              <rect x="-11" y="62" width="22" height="4" rx="1" fill="#0A5C31"/>
            </g>
          </g>
        </svg>
        <div class="crane-clock" id="clock">
          <div class="t" id="clockT">2:00</div>
          <div class="l">נותרו</div>
        </div>
      </div>`;
  }

  function updateTimerVisual(){
    const r=state.round;
    const b=document.getElementById('bldgRect'), top=document.getElementById('bldgTop');
    const t=document.getElementById('clockT'), c=document.getElementById('clock');
    if(!b||!t) return;
    const done=1-Math.max(0,r.timeLeft/COMP_SECONDS);   // building grows as time runs out
    const h=Math.round(104*done);
    b.setAttribute('y',130-h); b.setAttribute('height',h);
    top.setAttribute('y',128-h); top.setAttribute('height', h>4?4:0);
    const m=Math.floor(Math.max(0,r.timeLeft)/60), s=Math.max(0,r.timeLeft)%60;
    t.textContent=`${m}:${String(s).padStart(2,'0')}`;
    c.classList.toggle('danger', r.timeLeft<=20);
  }

  // ---------- play screen ----------
  function renderPlay(competition){
    const r=state.round;
    app.innerHTML = `
      ${competition ? craneHtml() : ''}
      <div class="qhead">
        <span>שאלה ${r.answered+1}</span>
        <span class="streak">${r.streak>0?'רצף ×'+r.streak:''}</span>
        <span>ניקוד ${r.score}</span>
      </div>

      <div class="qcard">
        <div class="diff-tag ${r.q.diff}">${DIFF_LABEL[r.q.diff]}</div>
        <div class="qtext">${esc(r.q.text)}</div>
        ${r.q.fmt==='date' ? '<div class="date-hint">__ / __ &nbsp;(חודש/שנה)</div>' : ''}
      </div>

      <div class="answer-bar empty" id="ans">${placeholderText()}</div>
      <div class="fb" id="fb"></div>

      <div class="keypad" id="pad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key" data-k=".">.</button>
        <button class="key" data-k="0">0</button>
        <button class="key" data-k="/">/</button>
      </div>
      <div class="action-row">
        <button class="action-key del" data-k="del"><span class="glyph">⌫</span>מחיקה</button>
        <button class="action-key ok" data-k="go"><span class="glyph">✓</span>אישור</button>
      </div>

      ${competition
        ? '<button class="ghost small" id="quit">פרישה ויציאה מהתחרות</button>'
        : '<button class="ghost small" id="endPractice">סיום התרגול</button>'}
    `;

    state.typed='';
    const handler=e=>{
      const btn=e.target.closest('[data-k]');
      if(!btn||btn.disabled) return;
      const k=btn.dataset.k;
      if(k==='go') return submitAnswer(competition);
      if(k==='del') state.typed=state.typed.slice(0,-1);
      else if(k==='.'){ const last=state.typed.split('/').pop(); if(!last.includes('.')) state.typed += last===''?'0.':'.'; }
      else if(k==='/'){ if(state.typed && !state.typed.includes('/')) state.typed+='/'; }
      else if(state.typed.length < (state.round.q.fmt==='date'?5:12)) state.typed+=k;
      updateAns();
    };
    app.querySelector('#pad').addEventListener('click',handler);
    app.querySelector('.action-row').addEventListener('click',handler);

    if(competition) app.querySelector('#quit').onclick=quitCompetition;
    else app.querySelector('#endPractice').onclick=()=>{state.screen='practice-summary'; render();};
  }

  function placeholderText(){
    return state.round && state.round.q.fmt==='date' ? 'הקישו חודש/שנה' : 'הקישו את התשובה';
  }
  function updateAns(){
    const d=document.getElementById('ans');
    if(!d) return;
    if(state.typed){ d.textContent=state.typed; d.classList.remove('empty'); }
    else { d.textContent=placeholderText(); d.classList.add('empty'); }
  }

  function parseTyped(s){
    if(s.includes('/')){
      const [a,b]=s.split('/');
      const na=parseFloat(a), nb=parseFloat(b);
      if(isNaN(na)||isNaN(nb)||nb===0) return NaN;
      return na/nb;
    }
    return parseFloat(s);
  }

  function submitAnswer(competition){
    const r=state.round;
    if(r.locked||!state.typed) return;
    if(competition && r.timeLeft<=0) return;
    r.locked=true;

    const secs=(performance.now()-r.qStart)/1000;
    let ok;
    if(r.q.fmt==='date'){
      const n=normDate(state.typed);
      ok = n!==null && n===r.q.answer;
    } else {
      const val=parseTyped(state.typed);
      ok = !isNaN(val) && Math.abs(val-r.q.answer)<0.005;
    }

    let pts=0;
    if(ok){
      pts=Math.max(20,Math.round((100-secs*12)*DIFF_MULT[r.q.diff])) + Math.min(50,r.streak*5);
      r.streak++; r.correct++;
    } else r.streak=0;
    r.score+=pts; r.answered++;

    const d=document.getElementById('ans');
    d.classList.add(ok?'correct':'wrong');
    app.querySelectorAll('[data-k]').forEach(k=>k.disabled=true);
    const fb=document.getElementById('fb');
    fb.className='fb '+(ok?'ok':'bad');
    const shown = r.q.fmt==='date' ? r.q.answer : fmtNum(r.q.answer);
    fb.textContent = ok ? `נכון!  +${pts} נקודות` : `לא נכון — התשובה: ${shown}`;

    setTimeout(()=>{
      if(competition && r.timeLeft<=0) return;
      r.q=makeQuestion(r.diff); r.qStart=performance.now(); r.locked=false;
      render();
      if(competition) updateTimerVisual();
    }, ok?600:1300);
  }

  // ================= RESULTS =================
  function renderPracticeSummary(){
    const r=state.round;
    const acc=r.answered?Math.round(r.correct/r.answered*100):0;
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">סיכום תרגול · ${DIFF_LABEL[r.diff]}</h1>
      <div class="panel green-top">
        <div class="bigscore">${r.score}</div>
        <div class="bigscore-l">ניקוד בתרגול (לא נשמר בטבלה)</div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="n">${r.answered}</div><div class="l">שאלות</div></div>
        <div class="stat"><div class="n">${acc}%</div><div class="l">דיוק</div></div>
        <div class="stat"><div class="n">${r.correct}</div><div class="l">נכונות</div></div>
      </div>
      <button class="cta" id="again">עוד סיבוב באותה רמה</button>
      <button class="ghost" id="home">חזרה לדף הבית</button>
    `;
    app.querySelector('#again').onclick=()=>startPractice(r.diff);
    app.querySelector('#home').onclick=()=>{state.screen='home'; render();};
  }

  function renderCompResult(){
    const r=state.round;
    const lb=state.finalLb.slice().sort((a,b)=>b.score-a.score);
    const i=lb.findIndex(x=>nameKey(x.name)===nameKey(state.compName));
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">${state.quit?'פרשת מהתחרות':'הזמן נגמר'}</h1>
      <div class="panel">
        <div class="bigscore">${r.score}</div>
        <div class="bigscore-l">${state.quit?'פרישה נרשמת עם 0 נקודות' : `ניקוד סופי · ${r.answered} שאלות · ${r.correct} נכונות`}</div>
        ${i>=0 ? `<div class="rankpill">מקום ${i+1} מתוך ${lb.length} השבוע</div>` : ''}
      </div>
      ${state.saveError
        ? `<p class="footnote" style="color:#FF7A72">הניקוד לא נשמר בטבלה (${esc(state.saveError)}). בדקו את החיבור לאינטרנט.</p>`
        : lbHtml(lb, state.compName)}
      ${modeNote()}
      <button class="ghost" id="home">חזרה לדף הבית</button>
    `;
    state.quit=false;
    app.querySelector('#home').onclick=()=>{state.screen='home'; render();};
  }

  async function renderLeaderboardScreen(){
    app.innerHTML = `
      ${brandbar()}
      <h1 class="title">טבלת המובילים</h1>
      <p class="sub">השבוע שהחל ב-${weekLabel} · הטבלה מתאפסת בשבת ב-23:59</p>
      <div class="panel" id="slot"><div class="lb-empty">טוען…</div></div>
      <button class="ghost" id="home">חזרה לדף הבית</button>
    `;
    app.querySelector('#home').onclick=()=>{state.screen='home'; render();};
    let lb=[], failed=null;
    try{ lb=(await getLeaderboard()).slice().sort((a,b)=>b.score-a.score); }
    catch(err){ failed=err.message; }
    const me=await getPlayerName();
    const slot=document.getElementById('slot');
    if(slot){
      slot.outerHTML = failed
        ? `<div class="panel"><div class="lb-empty">לא הצלחנו לטעון את הטבלה (${esc(failed)}). בדקו את החיבור לאינטרנט.</div></div>` + modeNote()
        : lbHtml(lb,me) + modeNote();
    }
    const h=app.querySelector('#home');
    if(h) h.onclick=()=>{state.screen='home'; render();};
  }

  function lbHtml(lb, me){
    if(!lb.length) return `<div class="panel"><div class="lb-empty">עדיין אין תוצאות השבוע — היו הראשונים להתחרות.</div></div>`;
    const rows=lb.map((r,i)=>`
      <li class="${me && nameKey(r.name)===nameKey(me)?'me':''}">
        <span class="r">${i+1}</span>
        <span class="n">${esc(r.name)}</span>
        <span class="s">${r.score}</span>
      </li>`).join('');
    return `<div class="panel"><ul class="lb">${rows}</ul></div>`;
  }

  render();
})();
</script>
</body>
</html>
